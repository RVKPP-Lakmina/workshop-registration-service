name: API tests

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://workshop_registration:workshop_registration@localhost:5432/workshop_registration_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workshop_registration
          POSTGRES_PASSWORD: workshop_registration
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workshop_registration"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api test:api
